name: Import mobile ZIP candidate

on:
  push:
    branches:
      - incoming
    paths:
      - 'incoming/*.zip'
  workflow_dispatch:
    inputs:
      archive_path:
        description: 'ZIP path already committed on the selected ref (for example incoming/UPDS_PATCH.zip)'
        required: true
        type: string
      candidate_label:
        description: 'Optional short label for the candidate branch'
        required: false
        type: string

concurrency:
  group: mobile-import
  cancel-in-progress: false

jobs:
  validate-candidate:
    name: Validate candidate in read-only sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      archive_name: ${{ steps.meta.outputs.archive_name }}
      candidate_slug: ${{ steps.meta.outputs.candidate_slug }}
    steps:
      - name: Check out uploaded archive branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out protected pipeline baseline from main
        uses: actions/checkout@v6
        with:
          ref: main
          path: baseline
          persist-credentials: false
      - name: Resolve uploaded ZIP
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            archive="${{ inputs.archive_path }}"
            label="${{ inputs.candidate_label }}"
          else
            mapfile -t archives < <(find incoming -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)
            if [[ ${#archives[@]} -ne 1 ]]; then
              echo "Expected exactly one ZIP in incoming/, found ${#archives[@]}." >&2
              exit 1
            fi
            archive="${archives[0]}"
            label=""
          fi
          test -f "$archive"
          cp "$archive" "$RUNNER_TEMP/candidate.zip"
          name="$(basename "$archive")"
          stem="${name%.zip}"
          if [[ -n "$label" ]]; then stem="$label"; fi
          slug="$(printf '%s' "$stem" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g' | cut -c1-48)"
          test -n "$slug" || slug="candidate"
          echo "archive_name=$name" >> "$GITHUB_OUTPUT"
          echo "candidate_slug=$slug" >> "$GITHUB_OUTPUT"
      - name: Detect candidate archive mode
        id: archive-mode
        shell: bash
        run: |
          set -euo pipefail
          mode="$(
            python3 - "$RUNNER_TEMP/candidate.zip" <<'PY'
          import json
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              try:
                  manifest = json.loads(archive.read("patch-manifest.json"))
              except KeyError:
                  print("full")
              except Exception as exc:
                  raise SystemExit(f"Invalid patch-manifest.json: {exc}")
              else:
                  if manifest.get("format") != "upds-delta-v1":
                      raise SystemExit(
                          "patch-manifest.json exists but format is not upds-delta-v1"
                      )
                  print("delta")
          PY
          )"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Candidate archive mode: $mode"

      - name: Validate and extract FULL_PROJECT candidate
        if: ${{ steps.archive-mode.outputs.mode == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 baseline/scripts/validate-upload-zip.py "$RUNNER_TEMP/candidate.zip"
          mkdir -p "$RUNNER_TEMP/candidate"
          python3 -m zipfile -e "$RUNNER_TEMP/candidate.zip" "$RUNNER_TEMP/candidate"

      - name: Validate and apply DELTA candidate to current main
        if: ${{ steps.archive-mode.outputs.mode == 'delta' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/candidate"
          mkdir -p "$RUNNER_TEMP/candidate"
          rsync -a --delete --exclude='.git/' baseline/ "$RUNNER_TEMP/candidate/"
          current_main_sha="$(git -C baseline rev-parse HEAD)"
          python3 baseline/scripts/apply-delta-zip.py \
            "$RUNNER_TEMP/candidate.zip" \
            "$current_main_sha" \
            "$RUNNER_TEMP/candidate"

      - name: Reject pipeline self-modification from mobile ZIP
        shell: bash
        run: |
          set -euo pipefail
          diff -qr baseline/.github/workflows "$RUNNER_TEMP/candidate/.github/workflows"
          cmp baseline/scripts/validate-upload-zip.py "$RUNNER_TEMP/candidate/scripts/validate-upload-zip.py"
          cmp baseline/scripts/apply-delta-zip.py "$RUNNER_TEMP/candidate/scripts/apply-delta-zip.py"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install candidate dependencies without lifecycle scripts
        working-directory: ${{ runner.temp }}/candidate
        run: npm ci --ignore-scripts
      - name: Run candidate full project check
        working-directory: ${{ runner.temp }}/candidate
        run: npm run check
      - name: Preserve validated candidate build
        run: cp -a "$RUNNER_TEMP/candidate/dist" "$RUNNER_TEMP/candidate-dist"
      - name: Pack validated source without dependencies/build output
        run: |
          rm -rf "$RUNNER_TEMP/candidate/node_modules" "$RUNNER_TEMP/candidate/dist"
          tar -C "$RUNNER_TEMP/candidate" -czf "$RUNNER_TEMP/candidate-source.tgz" .
      - name: Upload validated candidate source
        uses: actions/upload-artifact@v4
        with:
          name: candidate-source
          path: ${{ runner.temp }}/candidate-source.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Upload validated candidate build
        uses: actions/upload-artifact@v4
        with:
          name: candidate-dist
          path: ${{ runner.temp }}/candidate-dist
          if-no-files-found: error
          retention-days: 7

  build-stable:
    name: Build current main for stable Pages root
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run stable full project check
        run: npm run check
      - name: Upload stable build
        uses: actions/upload-artifact@v4
        with:
          name: stable-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  open-pr:
    name: Create candidate branch and pull request
    needs: validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
      branch: ${{ steps.branch.outputs.branch }}
    steps:
      - name: Check out main without executing candidate code
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Download validated source artifact
        uses: actions/download-artifact@v4
        with:
          name: candidate-source
          path: ${{ runner.temp }}/validated-source
      - name: Replace working tree with validated source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          tar -C "$RUNNER_TEMP/source" -xzf "$RUNNER_TEMP/validated-source/candidate-source.tgz"
          rsync -a --delete --exclude='.git/' "$RUNNER_TEMP/source/" ./
      - name: Create or reuse candidate branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="candidate/${{ needs.validate-candidate.outputs.candidate_slug }}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Build the exact validated candidate tree locally first. A rerun keeps
          # GITHUB_RUN_ID, so the same deterministic branch name is expected.
          git switch -c "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "Candidate is identical to main; refusing to create an empty PR." >&2
            exit 1
          fi
          git commit -m "Import ${{ needs.validate-candidate.outputs.archive_name }}"
          local_tree="$(git rev-parse 'HEAD^{tree}')"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "$branch:refs/remotes/origin/$branch"
            remote_tree="$(git rev-parse "refs/remotes/origin/$branch^{tree}")"
            if [[ "$remote_tree" != "$local_tree" ]]; then
              echo "Candidate branch $branch already exists with different content; refusing to overwrite it." >&2
              exit 1
            fi
            echo "Candidate branch already contains this validated tree; reusing it."
          else
            git push origin "$branch"
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open or reuse pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          ARCHIVE: ${{ needs.validate-candidate.outputs.archive_name }}
        shell: bash
        run: |
          set -euo pipefail

          pr_url="$(gh pr list --base main --head "$BRANCH" --state open --limit 1 --json url --jq '.[0].url // ""')"
          if [[ -n "$pr_url" ]]; then
            echo "Open pull request already exists for $BRANCH; reusing $pr_url."
          else
            existing_state="$(gh pr list --base main --head "$BRANCH" --state all --limit 1 --json state --jq '.[0].state // ""')"
            if [[ -n "$existing_state" ]]; then
              echo "A non-open pull request already exists for $BRANCH (state: $existing_state); refusing to create a duplicate." >&2
              exit 1
            fi

            pr_url="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Candidate import: $ARCHIVE" \
              --body $'Mobile ZIP candidate imported by GitHub Actions.\n\n- The archive passed `npm run check` in a read-only job before this branch was created.\n- Independent PR CI must still be explicitly approved and pass before merge.\n- Test the GitHub Pages preview linked by the import workflow before merging.\n- Do not merge if the changed-file list contains unexpected canon, VN IDs, save key, art-direction, or rig-contract changes.' )"
          fi

          pr_number="${pr_url##*/}"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

  deploy-preview:
    name: Deploy main + candidate GitHub Pages preview
    needs:
      - validate-candidate
      - build-stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    outputs:
      preview_url: ${{ steps.url.outputs.preview_url }}
    steps:
      - name: Download stable build
        uses: actions/download-artifact@v4
        with:
          name: stable-dist
          path: ${{ runner.temp }}/site
      - name: Download candidate build into preview path
        uses: actions/download-artifact@v4
        with:
          name: candidate-dist
          path: ${{ runner.temp }}/site/preview
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy combined stable + preview site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish preview URL output
        id: url
        shell: bash
        run: echo "preview_url=${{ steps.deployment.outputs.page_url }}preview/" >> "$GITHUB_OUTPUT"

  annotate:
    name: Report mobile preview
    needs:
      - open-pr
      - deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview link on pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ needs.open-pr.outputs.pr_url }}
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
        shell: bash
        run: |
          body="$(printf '📱 **GitHub Pages candidate preview:** %s\n\nThe Pages root remains the current `main`; `/preview/` is this candidate. Test it on the phone before merge.' "$PREVIEW_URL")"
          gh pr comment "$PR_URL" --body "$body"

  cleanup-incoming:
    name: Reset binary inbox branch
    if: ${{ github.event_name == 'push' && needs.validate-candidate.result == 'success' && needs.build-stable.result == 'success' && needs.open-pr.result == 'success' && needs.deploy-preview.result == 'success' && needs.annotate.result == 'success' }}
    needs:
      - validate-candidate
      - build-stable
      - open-pr
      - deploy-preview
      - annotate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Force-reset incoming to current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Drop uploaded ZIP from reachable incoming history
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:incoming
