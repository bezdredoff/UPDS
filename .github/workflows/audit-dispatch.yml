name: UPDS Audits

on:
  workflow_dispatch:
    inputs:
      audit:
        description: 'Which audit suite to run'
        required: true
        default: 'docs'
        type: choice
        options:
          - docs
          - story
          - character
          - scene
          - localization
          - tooling
          - all

permissions:
  contents: read

jobs:
  run-audit:
    name: Run selected audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run selected audit
        run: |
          AUDIT="${{ github.event.inputs.audit }}"
          echo "Selected audit: $AUDIT"
          case "$AUDIT" in
            docs)
              npm run docs:audit
              ;;
            story)
              npm run story:audit
              ;;
            character)
              npm run character:audit
              ;;
            scene)
              npm run scene:audit
              ;;
            localization)
              npm run localization:audit
              ;;
            tooling)
              npm run tooling:audit
              ;;
            all)
              npm run docs:audit
              npm run story:audit
              npm run character:audit
              npm run scene:audit
              npm run localization:audit
              npm run tooling:audit
              ;;
            *)
              echo "Unknown audit '$AUDIT'"
              exit 2
              ;;
          esac
