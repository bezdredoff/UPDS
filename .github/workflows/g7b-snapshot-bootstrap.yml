name: G7B Snapshot Bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  snapshot-bootstrap:
    if: github.event.pull_request.number == 158 && github.event.pull_request.head.ref == 'feature/anm-023g7b-visual-golden-samples'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install production build dependencies
        run: npm ci --ignore-scripts
      - name: Install isolated Playwright package
        run: npm --prefix e2e install --ignore-scripts --package-lock=false
      - name: Install WebKit and system dependencies
        run: npm --prefix e2e exec -- playwright install --with-deps webkit
      - name: Generate mobile WebKit Golden Samples
        run: npm --prefix e2e run test:webkit-mobile -- visual-regression.pw.ts --update-snapshots
      - name: Commit generated snapshots back to the candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/tests/visual-regression.pw.ts-snapshots/*.png
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "ANM-023G7B capture mobile WebKit Golden Samples"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
